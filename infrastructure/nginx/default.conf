# Upstream API
upstream ecomesta_api {
    server host.docker.internal:3001;
}

# Upstream public storefront
upstream ecomesta_web {
    server host.docker.internal:3000;
}

# Upstream merchant dashboard
upstream ecomesta_merchant {
    server host.docker.internal:3002;
}

# Upstream admin dashboard
upstream ecomesta_admin {
    server host.docker.internal:3003;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://ecomesta_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /merchant/ {
        proxy_pass http://ecomesta_merchant/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /admin/ {
        proxy_pass http://ecomesta_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://ecomesta_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

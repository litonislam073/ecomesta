# Storefront hosts (apex, store subdomains). Same as security-headers.conf,
# except that a theme editor preview (?theme_preview=…) may be framed by the
# merchant dashboard: $storefront_frame_options / $storefront_frame_ancestors
# are set by the maps in the server template. An empty value sends no header.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options $storefront_frame_options always;
add_header Content-Security-Policy $storefront_frame_ancestors always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

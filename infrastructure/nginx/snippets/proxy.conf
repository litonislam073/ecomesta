# Forwarded headers are always overwritten with what nginx itself observed.
# The apps trust these only because TRUST_PROXY=true / TRUSTED_PROXY_HOPS=1 and
# the app containers are not reachable except through this proxy.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Forwarded         "";
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

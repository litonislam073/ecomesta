# Storefront locations (apex, store subdomains, custom domains). Page renders
# reach the API from the web container's address, so per-shopper rate limiting
# for page views happens here, keyed on the real client address. Limits are
# generous because mobile carriers put many shoppers behind one CGNAT address.

location ^~ /_next/static/ {
    proxy_pass http://ecomesta_web;
    include /etc/nginx/snippets/proxy.conf;
}

location / {
    limit_req zone=storefront burst=120 nodelay;
    proxy_pass http://ecomesta_web;
    include /etc/nginx/snippets/proxy.conf;
}

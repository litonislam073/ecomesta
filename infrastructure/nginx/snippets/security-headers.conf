# Applied to the Next.js apps. The API sets its own equivalents via helmet, so
# this snippet is intentionally not included in the API server block.
# HSTS omits includeSubDomains/preload so a staging mistake cannot pin
# unrelated subdomains to HTTPS for a year.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

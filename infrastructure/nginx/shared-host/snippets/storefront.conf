# Shared-host variant of snippets/storefront.conf (uses the shared-host proxy headers).

location ^~ /_next/static/ {
    proxy_pass http://ecomesta_web;
    include /etc/nginx/shared-snippets/proxy.conf;
}

location / {
    limit_req zone=storefront burst=120 nodelay;
    proxy_pass http://ecomesta_web;
    include /etc/nginx/shared-snippets/proxy.conf;
}

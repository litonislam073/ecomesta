# Shared-host variant of snippets/proxy.conf. Visitors always reach the host
# web server over HTTPS (Cloudflare SSL Full strict), so the scheme and port
# are fixed rather than taken from this plain-HTTP hop. $edge_client_ip is the
# visitor address validated in the template (QA-002); only it is passed on, so
# the apps never see a client-supplied CF-Connecting-IP or X-Forwarded-For.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port  443;
proxy_set_header X-Forwarded-For   $edge_client_ip;
proxy_set_header X-Real-IP         $edge_client_ip;
proxy_set_header CF-Connecting-IP  $edge_client_ip;
proxy_set_header Forwarded         "";
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

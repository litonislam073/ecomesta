# Shared-host variant of snippets/proxy.conf. Visitors always reach the host
# web server over HTTPS (Cloudflare SSL Full strict), so the scheme and port
# are fixed rather than taken from this plain-HTTP hop. $remote_addr is the
# visitor address resolved by real_ip in the template.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port  443;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header Forwarded         "";
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecomesta-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecomesta
      POSTGRES_PASSWORD: ecomesta
      POSTGRES_DB: ecomesta
    volumes:
      - ecomesta_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomesta -d ecomesta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecomesta-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ecomesta_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink for transactional email (UI http://localhost:8025).
  # Point API at it with EMAIL_PROVIDER_MODE=smtp and the SMTP_* values in .env.example.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: ecomesta-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  ecomesta_postgres_data:
  ecomesta_redis_data:
